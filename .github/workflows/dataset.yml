name: update song catalog
# Weekly: refresh Wikidata, read more Indian/English playlists, add new chart songs.
on:
  schedule:
    - cron: '17 3 * * 1'   # Mondays 03:17 UTC
  workflow_dispatch:
    inputs:
      playlist_budget: { description: max playlist pages to read this run, default: '450' }
      chart_budget: { description: max new chart songs to look up this run, default: '600' }
permissions:
  contents: write
concurrency: { group: dataset, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Build catalog
        env:
          PB: '${{ inputs.playlist_budget || 450 }}'
          CB: '${{ inputs.chart_budget || 600 }}'
        run: python -u dataset/build.py --playlist-budget "$PB" --chart-budget "$CB"
      - name: Commit if changed
        if: always()
        run: |
          git config user.name "echo-catalog-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          git diff --cached --quiet || git commit -m "Song catalog update $(date -u +%F)"
          git pull --rebase -q && git push
