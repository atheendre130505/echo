<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121212">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Echo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css?v=9">
</head>
<body>
<main id="view"></main>

<div id="mini" hidden>
  <div class="mini-body">
    <img id="miniArt" alt="">
    <div class="mini-meta"><b id="miniTitle"></b><span id="miniArtist"></span></div>
    <button id="miniLike" class="ib" aria-label="Like"></button>
    <button id="miniPP" class="ib" aria-label="Play or pause"></button>
  </div>
  <div class="mini-prog"><i id="miniBar"></i></div>
</div>

<nav id="tabs">
  <a href="#home" data-tab="home"></a>
  <a href="#search" data-tab="search"></a>
  <a href="#library" data-tab="library"></a>
</nav>

<section id="np" aria-hidden="true">
  <div class="np-bg" id="npBg"></div>
  <header class="np-top">
    <button id="npClose" class="ib" aria-label="Close player"></button>
    <div class="np-ctx"><small>PLAYING FROM</small><b id="npCtx">Echo</b></div>
    <button id="npMore" class="ib" aria-label="More"></button>
  </header>
  <div class="np-media" id="npMedia">
    <div id="ytbox"><div id="yt"></div></div>
    <video id="lv" playsinline preload="auto"></video>
    <img id="npArt" alt="">
    <div id="tapHint" hidden>Tap the video once to start playback</div>
  </div>
  <div class="np-mode" id="npMode">
    <button data-mode="audio">Song</button><button data-mode="video">Video</button>
  </div>
  <div class="np-meta">
    <div class="np-meta-t"><h2 id="npTitle"></h2><p id="npArtist"></p></div>
    <button id="npLike" class="ib" aria-label="Like"></button>
  </div>
  <div class="np-prog">
    <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek">
    <div class="times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
  </div>
  <div class="np-ctrl">
    <button id="shuf" class="ib" aria-label="Shuffle"></button>
    <button id="prev" class="ib lg" aria-label="Previous"></button>
    <button id="pp" class="pp" aria-label="Play or pause"></button>
    <button id="next" class="ib lg" aria-label="Next"></button>
    <button id="rep" class="ib" aria-label="Repeat"></button>
  </div>
  <div class="np-actions">
    <button id="npDl" class="ib" aria-label="Download"></button>
    <button id="npRadio" class="ib" aria-label="Song radio"></button>
    <button id="npShare" class="ib" aria-label="Share"></button>
    <button id="npQueue" class="ib" aria-label="Queue"></button>
  </div>
  <div class="lyr" id="lyr">
    <div class="lyr-tabs">
      <button data-lt="lyrics" class="on">Lyrics</button>
      <button data-lt="synced">Synced</button>
      <button data-lt="meaning">Meaning</button>
    </div>
    <div id="lyrBody" class="lyr-body"></div>
  </div>
  <div class="np-pad"></div>
</section>

<div id="sheetWrap" hidden><div class="sheet-scrim"></div><div id="sheet" class="sheet"></div></div>
<div id="toast" hidden></div>
<div id="ytfWrap" aria-hidden="true"></div>

<script src="app.js?v=9"></script>
<script src="https://www.youtube.com/iframe_api" async></script>
</body>
</html>
